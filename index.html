<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GeoSnap — Карта фотографій та моментів</title>
    <meta name="description" content="Інтерактивна карта для додавання та перегляду фотографій з друзями." />
    <meta name="theme-color" content="#3D405B" />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Leaflet & MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Application Stylesheets -->
    <script type="module" crossorigin src="./assets/index-BkofE0uK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D8asp-FR.css">
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Clean Minimal Header (Logo only + Active Group Indicator) -->
      <header class="app-header">
        <div class="logo-group">
          <div class="logo-icon">📍</div>
          <div class="logo-text">
            <span class="logo-title">GeoSnap</span>
            <span class="logo-subtitle">Карта спільних моментів</span>
          </div>
        </div>

        <div class="header-actions">
          <!-- Shown only when inside a group -->
          <button id="header-group-badge" class="btn-icon-pill" style="display: none; background: #E8F0FE; border-color: #D2E3FC; color: #1A73E8;" title="Активна група">
            <span class="icon">👥</span>
            <span class="btn-text">Група</span>
          </button>
        </div>
      </header>

      <!-- Map Container -->
      <main class="map-wrapper">
        <div id="map" class="map-view"></div>
        
        <!-- Crosshair Picker Overlay -->
        <div id="crosshair-picker" class="crosshair-picker hidden">
          <div class="crosshair-icon">📍</div>
          <div class="crosshair-tooltip">Перетягніть карту, щоб вибрати місце</div>
          <button id="btn-confirm-location" class="btn-primary btn-picker-confirm">
            ✓ Підтвердити це місце
          </button>
        </div>

        <!-- Floating Map Controls -->
        <div class="floating-controls">
          <button id="btn-locate-me" class="btn-fab" title="Моє місцезнаходження" aria-label="Моє місцезнаходження">
            🧭
          </button>
          <button id="btn-zoom-in" class="btn-fab" title="Наблизити" aria-label="Наблизити">
            ➕
          </button>
          <button id="btn-zoom-out" class="btn-fab" title="Віддалити" aria-label="Віддалити">
            ➖
          </button>
        </div>
      </main>

      <!-- Single Primary Navigation Bar (Bottom) -->
      <nav class="bottom-nav">
        <button id="nav-btn-explore" class="nav-item active" aria-label="Огляд карти">
          <span class="nav-icon">🗺️</span>
          <span class="nav-label">Карта</span>
        </button>

        <button id="nav-btn-gallery" class="nav-item" aria-label="Мої фото">
          <span class="nav-icon">🖼️</span>
          <span class="nav-label">Мої фото</span>
        </button>

        <!-- Central Upload FAB Button -->
        <div class="upload-btn-container">
          <button id="btn-open-upload" class="btn-upload-fab" aria-label="Додати нове фото">
            <span class="plus-sign">+</span>
          </button>
        </div>

        <button id="nav-btn-friends-bottom" class="nav-item" aria-label="Друзі та групи">
          <span class="nav-icon">👥</span>
          <span class="nav-label">Друзі</span>
        </button>

        <button id="nav-btn-profile-bottom" class="nav-item" aria-label="Мій профіль">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Профіль</span>
        </button>
      </nav>

      <!-- Toast Notification Container -->
      <div id="toast-container" class="toast-container" aria-live="polite"></div>

      <!-- Modals Container -->
      <div id="modal-container"></div>
    </div>

    <!-- Application Entry Point -->
  </body>
</html>
